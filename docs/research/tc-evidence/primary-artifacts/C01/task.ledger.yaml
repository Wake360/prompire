breaker_rounds:
- round: 1
  attempted:
  - Fix only linebelowheader and leave lineabove/SEPARATING_LINE plain — caught by case_headerless_delimiter_has_colons /
    case_separating_line_has_colons
  - Copy the colon_grid approach (declare colons, force left-align the cell text) — caught by case_data_rows_still_visually_aligned
  - Emit colons only for right/decimal columns, plain dashes elsewhere — caught by case_string_column_delimiter_is_left_aligned
  - Derive colons from column type (int/float) instead of resolved alignment — caught by case_center_alignment_colons / case_explicit_right_alignment_colons
  - Append ':' instead of replacing a dash (widens the delimiter row) — caught by case_delimiter_width_unchanged
  - Alias github to the pipe TableFormat outright — byte-identical everywhere, so not a violation
  - Fold the "no alignment" case into the left-aligned branch, with a special-cased early return for the empty-DataFrame path
    — NOT caught (chosen)
  verdict: counterexample
  confirmed: false
  detail: 'oracle caught it: case_center_alignment_colons, case_explicit_right_alignment_colons, case_github_delimiter_matches_pipe,
    case_headerless_delimiter_has_colons'
