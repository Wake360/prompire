name: tests
# A pull request branch is pushed *and* has an open PR, so a bare `[push, pull_request]`
# ran every suite twice on every push. Pushes are watched on the default branch only;
# everywhere else the pull_request event is the one that gates the merge.
on:
  push:
    branches: [master]
  pull_request:
jobs:
  full:
    strategy:
      # Every cell reports. A cancelled sibling hides a failure that is its own.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install PyYAML
      - run: python tests/run_all.py

  cli-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install PyYAML
      # Each suite is its own step, so the log names the one that broke. The steps stop
      # at the first failure, so a red suite here hides every suite below it.
      - run: python tests/battery.py
      - run: python tests/golden.py
      - run: python tests/docs.py
      - run: python tests/verify.py
      - run: python tests/cli.py
      - run: python tests/package.py
